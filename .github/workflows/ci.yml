name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check docqa tests eval
      - run: pytest -q
      - name: Retrieval evaluation on the FastAPI docs
        run: |
          ../scripts/fetch_corpus.sh data/corpus
          docqa ingest data/corpus --out data/index.pkl
          python -m docqa.cli eval eval/questions.jsonl --out-of-scope eval/out_of_scope.jsonl --json eval/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grounded-docqa .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name app grounded-docqa
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/ask -H 'content-type: application/json' \
            -d '{"question":"How do I return a 404 error?"}' | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['grounded'], d"
