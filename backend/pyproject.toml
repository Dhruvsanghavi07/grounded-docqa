[project]
name = "grounded-docqa"
version = "1.0.0"
description = "Retrieval-augmented question answering over technical docs, with citation checking"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Sanghavi" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools]
packages = ["docqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Newer Starlette warns that its TestClient will move off httpx; harmless for these tests.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
